<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="MyLofi - Трекер питания по фото и журнал тренировок">
    <meta name="theme-color" content="#18181b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyLofi">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>MyLofi - Трекер питания и тренировок</title>

    <!-- Anti-flash theme init: must run before first paint -->
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) {}
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
            document.documentElement.classList.toggle('dark', isDark);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#09090b' : '#fafafa');
        })();
    </script>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#27272a',
                            700: '#18181b',
                            800: '#09090b',
                            900: '#000000',
                        },
                        surface: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',
                            500: '#71717a',
                            600: '#52525b',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    spacing: {
                        'safe-bottom': 'env(safe-area-inset-bottom)',
                        'safe-top': 'env(safe-area-inset-top)',
                    }
                }
            }
        }
    </script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/css/styles.css?v=1.0.1">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512.png">
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom styles */
        
        /* ============ Glassmorphism (light + dark graphite) ============ */
        .glass {
            background: rgba(255, 255, 255, 0.72);
            -webkit-backdrop-filter: blur(4px) saturate(150%);
            backdrop-filter: blur(4px) saturate(150%);
            border: 1px solid rgba(24, 24, 27, 0.07);
            box-shadow: 0 1px 2px rgba(24, 24, 27, 0.04);
        }
        .dark .glass {
            background: rgba(24, 24, 27, 0.72);
            -webkit-backdrop-filter: blur(6px) saturate(140%);
            backdrop-filter: blur(6px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }
        .glass-strong {
            background: rgba(255, 255, 255, 0.92);
            -webkit-backdrop-filter: blur(6px) saturate(160%);
            backdrop-filter: blur(6px) saturate(160%);
            border: 1px solid rgba(24, 24, 27, 0.08);
            box-shadow: 0 10px 40px rgba(24, 24, 27, 0.10);
        }
        .dark .glass-strong {
            background: rgba(9, 9, 11, 0.86);
            -webkit-backdrop-filter: blur(8px) saturate(140%);
            backdrop-filter: blur(8px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
        }
        .glass-input {
            background: rgba(244, 244, 245, 0.8);
            border: 1px solid rgba(24, 24, 27, 0.08);
        }
        .dark .glass-input {
            background: rgba(63, 63, 70, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fafafa;
        }
        
        /* Ambient graphite ambience moved to styles.css: it now lives on
           #page-content, the scroll container that covers the viewport, so the
           themed background and the glow are painted by the same layer. */
        
        /* Theme transition (suppressed during boot) */
        html.theme-anim,
        html.theme-anim * {
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease !important;
        }
        
        .safe-area-inset-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .safe-area-inset-top {
            padding-top: env(safe-area-inset-top);
        }
        
        /* Pulse animation for pending meals */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 0.4; }
            100% { transform: scale(0.8); opacity: 0.8; }
        }
        .pulse-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid currentColor;
            animation: pulse-ring 1.5s ease-out infinite;
        }
        
        /* Progress ring animation */
        .progress-ring {
            transform: rotate(-90deg);
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s ease-out;
        }

        /* Caloric donut chart */
        .caloric-donut {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        .caloric-donut__track {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from -90deg, var(--donut-track) 0%, var(--donut-track) 100%);
        }
        .caloric-donut__progress {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from -90deg, var(--donut-color) 0%, var(--donut-color) var(--donut-pct), transparent var(--donut-pct), transparent 100%);
            transition: background 0.5s ease-out;
        }
        .caloric-donut__center {
            position: absolute;
            inset: 16px;
            border-radius: 50%;
        }

        /* Smooth transitions */
        .screen {
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .screen.hidden {
            display: none !important;
        }
        
        /* Bottom nav active state */
        .nav-item.active {
            color: #18181b;
        }
        .nav-item.active svg {
            stroke: #18181b;
        }
        .dark .nav-item.active {
            color: #f4f4f5;
        }
        .dark .nav-item.active svg {
            stroke: #f4f4f5;
        }
        
        /* Toast notifications */
        .toast-enter {
            animation: slideUp 0.3s ease-out;
        }
        .toast-exit {
            animation: slideDown 0.2s ease-in;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(20px); }
        }
        
        /* Camera preview */
        .camera-preview {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        
        /* Workout timer */
        .timer-display {
            font-variant-numeric: tabular-nums;
            font-family: 'Inter', monospace;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #71717a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa;
        }
        
        /* Input styles & prevent iOS zoom */
        input, select, textarea {
            font-size: 16px !important;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            ring: 2px;
            ring-color: #52525b;
        }
        
        /* Button press state */
        .btn-press:active {
            transform: scale(0.98);
        }
        
        /* Modal backdrop */
        .modal-backdrop {
            backdrop-filter: blur(4px);
            background: rgba(9, 9, 11, 0.4);
        }
    </style>
</head>
<body class="bg-surface-50 dark:bg-zinc-950 text-surface-900 dark:text-surface-50 min-h-screen font-sans">
    <!-- App Root -->
    <div id="app" class="min-h-screen flex flex-col relative">
        <!-- Top safe area -->
        <div class="h-safe-top"></div>
        
        <!-- Screens Container -->
        <div id="screens" class="flex-1 overflow-hidden relative">
            <!-- Landing Screen -->
            <div id="screen-landing" class="screen absolute inset-0 flex flex-col">
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                    <h1 class="text-4xl font-bold mb-4">MyLofi</h1>
                    <p class="mb-8">Трекер питания и тренировок</p>
                    <button data-action="show-auth" class="w-full py-3 bg-primary-600 text-white dark:bg-white dark:text-zinc-950 rounded-xl font-semibold shadow-md">Войти</button>
                </div>
            </div>
            
            <!-- Auth Screen -->
            <div id="screen-auth" class="screen absolute inset-0 flex flex-col hidden">
                <!-- Auth content will be rendered by JS -->
            </div>
            
            <!-- Main App Screen (with bottom nav) -->
            <div id="screen-main" class="screen absolute inset-0 flex flex-col hidden">
                <!-- Page Content -->
                <div id="page-content" class="flex-1 overflow-y-auto pb-20 safe-area-inset-bottom">
                    <!-- Pages will be rendered here -->
                </div>
                
                <!-- Bottom Navigation -->
                <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 z-50 glass-strong border-t border-surface-200 dark:border-white/10 safe-area-inset-bottom" style="display: none;">
                    <div class="grid grid-cols-3 gap-1 px-2 py-2">
                        <button data-page="nutrition" class="nav-item flex flex-col items-center gap-1 text-surface-500 dark:text-surface-400 btn-press transition-colors" aria-label="Питание">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                            <span class="text-xs font-medium">Питание</span>
                        </button>
                        <button data-page="workouts" class="nav-item flex flex-col items-center gap-1 text-surface-500 dark:text-surface-400 btn-press transition-colors" aria-label="Тренировки">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                            <span class="text-xs font-medium">Тренировки</span>
                        </button>
                        <button data-page="profile" class="nav-item flex flex-col items-center gap-1 text-surface-500 dark:text-surface-400 btn-press transition-colors" aria-label="Профиль">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                            <span class="text-xs font-medium">Профиль</span>
                        </button>
                    </div>
                </nav>
            </div>
        </div>
        
        <!-- Toast Container -->
        <div id="toast-container" class="fixed bottom-24 left-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
        
        <!-- Modals Container -->
        <div id="modals" class="fixed inset-0 z-50 pointer-events-none"></div>
    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(reg => {
                        console.log('SW registered:', reg.scope);
                        if (reg.waiting) {
                            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                        }
                        reg.addEventListener('updatefound', () => {
                            if (reg.installing) {
                                reg.installing.addEventListener('statechange', () => {
                                    if (reg.waiting) {
                                        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                                    }
                                });
                            }
                        });
                    })
                    .catch(err => console.log('SW registration failed:', err));
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    window.location.reload();
                });
            });
        }
    </script>

    <!-- Main App JS -->
    <script type="module" src="/static/js/app.js?v=1.0.1"></script>
</body>
</html>
